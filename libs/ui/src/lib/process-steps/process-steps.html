<section id="how-it-works" class="process-steps" aria-labelledby="process-steps-heading">
  <div class="process-steps__inner container">

    <header class="section-header">
      @if (sectionLabel()) {
        <span class="section-label">{{ sectionLabel() }}</span>
      }
      <h2 class="section-title" id="process-steps-heading">{{ heading() }}</h2>
    </header>

    <ol class="steps" aria-label="Steps to get started">
      @for (step of steps(); track $index; let last = $last) {
        <li class="step">
          @if (!last) {
            <div class="step__connector" aria-hidden="true"></div>
          }
          <div class="step__number" aria-hidden="true">{{ $index + 1 }}</div>
          <div class="step__body">
            <h3 class="step__title">{{ step.title }}</h3>
            <p class="step__desc">{{ step.description }}</p>
          </div>
        </li>
      }
    </ol>

  </div>
</section>
