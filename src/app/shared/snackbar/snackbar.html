@for (item of snackbar.items(); track item.id) {
  <div
    class="toast"
    [class.toast--success]="item.type === 'success'"
    [class.toast--error]="item.type === 'error'"
    [class.toast--info]="item.type === 'info'"
    [class.toast--out]="item.dismissing"
    role="status"
  >
    <span class="toast__icon" aria-hidden="true">
      @if (item.type === 'success') {
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M13.5 4.5 6.5 11.5 3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      } @else if (item.type === 'error') {
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 5v4M8 11h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      } @else {
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 7v4M8 5h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      }
    </span>

    <span class="toast__message">{{ item.message }}</span>

    <button
      class="toast__close"
      type="button"
      aria-label="Dismiss notification"
      (click)="dismiss(item.id)"
    >
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M11 3 3 11M3 3l8 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
}
