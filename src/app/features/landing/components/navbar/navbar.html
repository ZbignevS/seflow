<nav aria-label="Main navigation">
  <a href="/" class="logo" aria-label="Seflow — home">seflow</a>

  <ul class="links" role="list">
    <li><a mat-button href="/self-employed">{{ 'nav.individualActivity' | translate }}</a></li>
    <li><a mat-button href="/how-to-register">{{ 'nav.selfEmploymentGuide' | translate }}</a></li>
    <li><a mat-button href="/tax-calculator">{{ 'nav.taxCalculator' | translate }}</a></li>
  </ul>

  <div class="actions">
    <div class="lang-switch" role="group" aria-label="Language">
      <button
        class="lang-btn"
        [class.lang-btn--active]="locale() === 'en'"
        (click)="switchLocale('en')"
        [attr.aria-pressed]="locale() === 'en'"
        aria-label="English"
      >EN</button>
      <span class="lang-divider" aria-hidden="true"></span>
      <button
        class="lang-btn"
        [class.lang-btn--active]="locale() === 'mt'"
        (click)="switchLocale('mt')"
        [attr.aria-pressed]="locale() === 'mt'"
        aria-label="Malti"
      >MT</button>
    </div>

    @if (currentUser()) {
      <!-- Authenticated state -->
      <div class="user-menu" role="group" aria-label="User menu">
        <span class="user-name" aria-label="Signed in as {{ currentUser()!.email }}">
          {{ currentUser()!.displayName ?? currentUser()!.email }}
        </span>
        <button class="sign-out-btn" type="button" (click)="signOut()">Sign out</button>
      </div>
    } @else {
      <!-- Unauthenticated state -->
      <button mat-button type="button" (click)="openLogin()">
        {{ 'nav.login' | translate }}
      </button>
      <button mat-raised-button color="primary" type="button" (click)="openRegister()">
        {{ 'nav.getStarted' | translate }}
      </button>
    }
  </div>
</nav>
